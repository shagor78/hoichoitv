version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hoichoi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-password}
      MYSQL_DATABASE: ${DB_NAME:-hoichoi_iptv}
      MYSQL_USER: ${DB_USER:-hoichoi}
      MYSQL_PASSWORD: ${DB_PASS:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hoichoi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hoichoi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hoichoi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoichoi-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hoichoi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoichoi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - hoichoi-network

  nginx:
    image: nginx:alpine
    container_name: hoichoi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hoichoi-network

networks:
  hoichoi-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
